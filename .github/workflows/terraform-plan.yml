name: Terraform Plan

on:
  push:
    branches:
      - 'feature/**'

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environment   # 👈 IMPORTANT (tere structure ke hisaab se)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Azure Login (agar Azure use kar raha hai)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./environment/preprod  
        run: terraform init

      - name: Terraform Validate
        working-directory: ./environment/preprod
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./environment/preprod
        run: terraform plan